title: Hunter Scheppat
name: Hunter Scheppat
description: "Hunter Scheppat. Machine translation, endangered languages, and software."
locale: en-US
url: https://hunterschep.github.io
baseurl: /website
repository: hunterschep/website
timezone: America/Los_Angeles

author:
  name: Hunter Scheppat
  avatar: headshot.png
  bio: "Machine translation &amp; NLP<br>Amazon Web Services"
  email: hunterschep@gmail.com
  github: hunterschep
  googlescholar: https://scholar.google.com/citations?user=MsjRFU8AAAAJ&hl=en
  linkedin: hunterscheppat
  huggingface: hunterschep

publication_category:
  first_author:
    title: First-author publications
  coauthored:
    title: Co-authored publications

collections:
  publications:
    output: true
    permalink: /publications/:path/
  talks:
    output: true
    permalink: /talks/:path/
  portfolio:
    output: true
    permalink: /portfolio/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: single

include:
  - _pages
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - scripts

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
highlighter: rouge

plugins:
  - jekyll-sitemap

social:
  links:
    - https://github.com/hunterschep
    - https://scholar.google.com/citations?user=MsjRFU8AAAAJ&hl=en
    - https://www.linkedin.com/in/hunterscheppat/
