title: Hunter Scheppat
name: Hunter Scheppat
description: "Language technology, endangered-language research, and useful software. Hunter Scheppat's little corner of the internet."
locale: en-US
title_separator: "|"
url: https://hunterschep.github.io
baseurl: /website
repository: hunterschep/website
site_theme: default
timezone: America/Los_Angeles

author:
  name: Hunter Scheppat
  avatar: headshot.png
  bio: "NLP researcher.<br>Software builder.<br>Associate Solutions Architect at AWS."
  education: "Boston College ’26<br>CS + Management · <em>cum laude</em>"
  email: hunterschep@gmail.com
  github: hunterschep
  googlescholar: https://scholar.google.com/citations?user=MsjRFU8AAAAJ&hl=en
  linkedin: hunterscheppat
  huggingface: hunterschep

publication_category:
  first_author:
    title: First-author publications
  coauthored:
    title: Co-authored publications

collections:
  publications:
    output: true
    permalink: /publications/:path/
  talks:
    output: true
    permalink: /talks/:path/
  portfolio:
    output: true
    permalink: /portfolio/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: true
      comments: false
      share: false
      related: false

include:
  - _pages
exclude:
  - README.md
  - ACADEMIC_PAGES_PLAN.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - scripts

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
highlighter: rouge
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true

plugins:
  - jekyll-feed
  - jekyll-sitemap

atom_feed:
  hide: true
comments:
  provider: false
analytics:
  provider: false
breadcrumbs: false

social:
  type: Person
  name: Hunter Scheppat
  links:
    - https://github.com/hunterschep
    - https://scholar.google.com/citations?user=MsjRFU8AAAAJ&hl=en
    - https://www.linkedin.com/in/hunterscheppat/
